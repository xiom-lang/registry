# XIOM registry publish -- OIDC trusted publishing for a community package.
#
# Setup (once):
#   1. Save this file as .github/workflows/publish-registry.yml in your repo.
#   2. Request a trusted publisher on the registry website:
#        - repository:  <your-account>/<your-repo>
#        - workflow:    publish-registry.yml
#        - refs:        refs/heads/main
#        - scope:       the `name` from package.xi
#   3. Run this workflow: Actions -> Publish to XIOM registry (OIDC).
#
# No long-lived token is stored: the job mints a short-lived registry token
# with GitHub OIDC (audience xiom-registry). The token's claims must match the
# approved trusted-publisher entry. The artifact is signed with the ed25519
# key from the XIOM_SIGNING_KEY secret, or an ephemeral key per run.
name: Publish to XIOM registry (OIDC)

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry base URL"
        required: true
        default: "https://registry.xiom-lang.org"
      mode:
        description: "publish, or yank the version below"
        required: true
        type: choice
        options: [publish, yank]
        default: publish
      version:
        description: "Version to yank (mode=yank only)"
        required: false

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      XIOM_REGISTRY: ${{ github.event.inputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show target
        run: |
          set -euo pipefail
          if [ -z "${XIOM_REGISTRY:-}" ]; then
            echo "::error::the registry input is empty; set it (staging: https://staging.registry.xiom-lang.org)"
            exit 1
          fi
          echo "TARGET registry: ${XIOM_REGISTRY}"
          echo "mode:            ${{ github.event.inputs.mode }}"
          echo "repo:            ${GITHUB_REPOSITORY}"
          echo "ref:             ${GITHUB_REF}"
          echo "package.xi name: $(sed -n 's/.*name:[[:space:]]*"\([^"]*\)".*/\1/p' package.xi | head -n1)"

      - name: Mint registry token (GitHub OIDC)
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request env is missing; the job needs id-token: write" >&2
            exit 1
          fi
          response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=xiom-registry")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$token" ]; then
            echo "empty OIDC token in response" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "XIOM_REGISTRY_TOKEN=$token" >> "$GITHUB_ENV"
          echo "minted registry OIDC token (audience xiom-registry)"

      - name: Read package name
        id: pkg
        run: |
          set -euo pipefail
          name="$(sed -n 's/.*name:[[:space:]]*"\([^"]*\)".*/\1/p' package.xi | head -n1)"
          if [ -z "$name" ]; then
            echo "no name: found in package.xi" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "package: $name"

      - name: Install toolchain
        if: github.event.inputs.mode == 'publish'
        run: |
          set -euo pipefail
          pin="v0.61.3"
          pv="${pin#v}"
          # Keep the toolchain OUT of the repository: `xiom pkg publish`
          # packages the working directory, so anything downloaded here would
          # be bundled into the package and blow the registry size limit.
          curl -fsSL -o "$RUNNER_TEMP/xiom-compiler.tar.gz" \
            "https://github.com/xiom-lang/xiom/releases/download/${pin}/xiom-${pv}-linux-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/compiler"
          tar -xzf "$RUNNER_TEMP/xiom-compiler.tar.gz" -C "$RUNNER_TEMP/compiler"
          test -x "$RUNNER_TEMP/compiler/bin/xiom"
          echo "$RUNNER_TEMP/compiler/bin" >> "$GITHUB_PATH"

      - name: Prepare signing key
        if: github.event.inputs.mode == 'publish'
        env:
          XIOM_SIGNING_KEY: ${{ secrets.XIOM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.xiom/keys"
          if [ -n "${XIOM_SIGNING_KEY:-}" ]; then
            printf '%s' "$XIOM_SIGNING_KEY" | tr -d '\r\n' > "$HOME/.xiom/keys/default.key"
            printf '\n' >> "$HOME/.xiom/keys/default.key"
            chmod 600 "$HOME/.xiom/keys/default.key"
            key_len="$(tr -d '\r\n' < "$HOME/.xiom/keys/default.key" | wc -c)"
            if [ "$key_len" -ne 64 ]; then
              echo "XIOM_SIGNING_KEY must be 64 hex chars (got $key_len)" >&2
              exit 1
            fi
            echo "using the XIOM_SIGNING_KEY secret"
          else
            echo "::warning::no XIOM_SIGNING_KEY secret; generating an ephemeral key for this run"
            xiom pkg keygen
          fi

      - name: Publish
        if: github.event.inputs.mode == 'publish'
        run: |
          set -euo pipefail
          echo "publishing to $XIOM_REGISTRY"
          xiom pkg publish

      - name: Yank
        if: github.event.inputs.mode == 'yank'
        env:
          YANK_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${YANK_VERSION:-}" ]; then
            echo "mode=yank requires the version input (e.g. 0.1.0)" >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${XIOM_REGISTRY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"reason":"withdrawn"}' \
            "${XIOM_REGISTRY}/packages/${{ steps.pkg.outputs.name }}/${YANK_VERSION}/yank"
          echo "yanked ${{ steps.pkg.outputs.name }}@${YANK_VERSION} on ${XIOM_REGISTRY}"
