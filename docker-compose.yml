# XIOM Package Registry -- Docker Compose (Portainer / Contabo VPS ready)
#
# Usage:
#   cp .env.example .env          # set TOKENS_FILE source, see below
#   docker compose up -d          # start in background
#   docker compose logs -f        # view logs
#   docker compose down           # stop
#
# Secrets: the publish tokens live in a JSON file on the host, mounted
# read-only (see scripts/keygen.js to generate entries). Never bake tokens
# into the image or this compose file.

services:
  # Production (default): `docker compose up -d`.
  registry:
    build: .
    image: xiom-registry:latest
    container_name: xiom-registry
    restart: unless-stopped
    # Per-service resource caps (ops load-prep, SCALING_LOAD_PLAN L0). Pre-
    # baseline defaults: ops tunes them after the staging characterization run.
    # Overridable from .env so tuning does not need a compose edit; changing a
    # value and running `docker compose up -d` recreates the container.
    cpus: "${XIOM_REGISTRY_CPUS:-1.5}"
    mem_limit: "${XIOM_REGISTRY_MEM_LIMIT:-1g}"
    pids_limit: "${XIOM_REGISTRY_PIDS_LIMIT:-256}"
    # Bind loopback only: Hestia nginx terminates TLS and proxies inward.
    # XIOM_REGISTRY_PORT exists because Gitea already owns 3000 on the panel
    # host; this deployment currently uses 3100 for both hostnames, and the
    # staging profile below claims 3200 for a genuinely separate instance.
    ports:
      - "127.0.0.1:${XIOM_REGISTRY_PORT:-3000}:3000"
    volumes:
      - registry_data:/app/data
      - registry_packages:/app/packages
      # Host token file, read-only. Create it with scripts/keygen.js and
      # point XIOM_TOKENS_FILE at it (defaults to ./tokens.json).
      - ${XIOM_TOKENS_FILE:-./tokens.json}:/run/secrets/xiom-tokens.json:ro
      # Host trusted-publishers directory, read-only at the same path. The
      # service reads /etc/xiom-registry/trusted-publishers.json; the VPS
      # keeps it at that exact path (0755, owner-managed). An absent or empty
      # file trusts no OIDC publishers (JWTs get 403); static tokens keep
      # working. Local runs can set XIOM_TRUSTED_PUBLISHERS_DIR to any dir.
      - ${XIOM_TRUSTED_PUBLISHERS_DIR:-/etc/xiom-registry}:/etc/xiom-registry:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TOKENS_FILE=/run/secrets/xiom-tokens.json
      - TRUSTED_PUBLISHERS_FILE=${XIOM_TRUSTED_PUBLISHERS_FILE:-/etc/xiom-registry/trusted-publishers.json}
      - REGISTRY_URL=${REGISTRY_URL:-https://registry.xiom-lang.org}
      # Set TRUST_PROXY=1 when running behind the Hestia nginx vhost so the
      # rate limiter sees client IPs from X-Forwarded-For.
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Registry 2.0 sign-in (identity only; never a publish credential).
      # Set both or neither: an id with an empty secret fails startup on
      # purpose, so a half-passed pair can never silently break the login.
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      # Comma-separated GitHub logins allowed to decide/fulfil requests.
      - REGISTRY_ADMIN_LOGINS=${REGISTRY_ADMIN_LOGINS:-}
      # Comma-separated GitHub logins allowed to action community reports.
      - REGISTRY_REVIEWER_LOGINS=${REGISTRY_REVIEWER_LOGINS:-}
      # Notification email (optional). Unset = in-app notices only.
      - SMTP_URL=${SMTP_URL:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Shared secret for the fulfiller worker's internal API (unset = off).
      - FULFILLER_SECRET=${FULFILLER_SECRET:-}
    security_opt:
      - no-new-privileges:true
    # Drop all capabilities; the service needs none.
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xiom
    # Optional read-only root filesystem (read_only: true). It requires the
    # Node process to write only under the two volumes and a tmpfs; enable it
    # after verifying `docker compose exec registry touch /app/data/.probe`.
    # read_only: true
    # tmpfs:
    #   - /tmp

  # Staging: a separate instance with its own volumes, tokens, and URL.
  # Opt-in only -- it carries a profile so a plain `docker compose up -d`
  # on a host that lacks the staging files cannot fail the production run.
  #
  #   cp .env.staging.example .env.staging   # set the token path
  #   docker compose --profile staging up -d --build
  #
  # Point the staging nginx vhost at 127.0.0.1:3200 (see DEPLOY.md).
  staging:
    profiles: ["staging"]
    build: .
    image: xiom-registry:latest
    container_name: xiom-registry-staging
    restart: unless-stopped
    # Staging caps (ops load-prep, SCALING_LOAD_PLAN L0): deliberately one
    # notch below production so the characterization run sees headroom.
    cpus: "${XIOM_STAGING_CPUS:-1.0}"
    mem_limit: "${XIOM_STAGING_MEM_LIMIT:-768m}"
    pids_limit: "${XIOM_STAGING_PIDS_LIMIT:-256}"
    ports:
      - "127.0.0.1:${XIOM_STAGING_PORT:-3200}:3000"
    volumes:
      - staging_data:/app/data
      - staging_packages:/app/packages
      - ${XIOM_STAGING_TOKENS_FILE:-./tokens.staging.json}:/run/secrets/xiom-tokens.json:ro
      # Staging sees only its own trusted-publishers subdirectory; the
      # production file is not mounted into this container.
      - ${XIOM_STAGING_TRUSTED_PUBLISHERS_DIR:-/etc/xiom-registry/staging}:/etc/xiom-registry/staging:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TOKENS_FILE=/run/secrets/xiom-tokens.json
      - TRUSTED_PUBLISHERS_FILE=${XIOM_STAGING_TRUSTED_PUBLISHERS_FILE:-/etc/xiom-registry/staging/trusted-publishers.json}
      - REGISTRY_URL=${XIOM_STAGING_REGISTRY_URL:-https://staging.registry.xiom-lang.org}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Separate OAuth app per environment; both values or neither.
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - REGISTRY_ADMIN_LOGINS=${REGISTRY_ADMIN_LOGINS:-}
      - REGISTRY_REVIEWER_LOGINS=${REGISTRY_REVIEWER_LOGINS:-}
      - SMTP_URL=${SMTP_URL:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - FULFILLER_SECRET=${FULFILLER_SECRET:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xiom

volumes:
  registry_data:
    driver: local
  registry_packages:
    driver: local
  # Staging volumes are declared unconditionally; compose only creates them
  # when the staging profile is active.
  staging_data:
    driver: local
  staging_packages:
    driver: local

networks:
  xiom:
    driver: bridge
