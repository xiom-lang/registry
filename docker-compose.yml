# XIOM Package Registry — Docker Compose (Portainer / Contabo VPS ready)
# Usage:
#   docker-compose up -d              # Start in background
#   docker-compose down               # Stop
#   docker-compose logs -f            # View logs
#   docker-compose pull && up -d      # Update

version: '3.8'

services:
  registry:
    build: .
    container_name: xiom-registry
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - registry_data:/app/data
      - registry_packages:/app/packages
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Set API_KEY for publish authentication (leave empty for open registry)
      - API_KEY=${API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - xiom

  # Optional: nginx reverse proxy with HTTPS
  # Uncomment if using nginx-proxy + Let's Encrypt on Portainer
  # nginx:
  #   image: nginx:alpine
  #   container_name: xiom-registry-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - certs:/etc/nginx/certs
  #   depends_on:
  #     - registry
  #   networks:
  #     - xiom

volumes:
  registry_data:
    driver: local
  registry_packages:
    driver: local
  # certs:
  #   driver: local

networks:
  xiom:
    driver: bridge
