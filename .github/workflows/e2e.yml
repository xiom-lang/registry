name: Registry e2e (real client)

# The end-to-end gate drives the REAL `xiom-pkg` client against a locally
# started registry (SESSION.md section 5, T8). It needs the xiom compiler
# repo because the client lives there (crates/xiom-pkg).
#
# xiom-lang/xiom is public today, so the clone uses anonymous HTTPS and the
# job skips (not fails) on forks without secrets. If the compiler repo goes
# private, set the org secret XIOM_CROSS_REPO_TOKEN (fine-grained PAT,
# Contents: Read-only on xiom-lang/xiom) and this workflow will use it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/e2e/**"

permissions:
  contents: read

concurrency:
  group: registry-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: xiom-pkg client e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build xiom-pkg client
        id: client
        env:
          # Optional: for private compiler checkouts. Empty on fork PRs.
          CROSS_REPO_TOKEN: ${{ secrets.XIOM_CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CROSS_REPO_TOKEN:-}" ]; then
            url="https://x-access-token:${CROSS_REPO_TOKEN}@github.com/xiom-lang/xiom.git"
          else
            url="https://github.com/xiom-lang/xiom.git"
          fi
          if ! git clone --depth 1 "$url" "$RUNNER_TEMP/xiom"; then
            echo "::notice::cannot clone xiom-lang/xiom; skipping the client gate"
            exit 0
          fi
          cd "$RUNNER_TEMP/xiom"
          if ! cargo build -p xiom-pkg; then
            echo "::notice::xiom-pkg build failed; skipping the client gate"
            exit 0
          fi
          echo "client=$RUNNER_TEMP/xiom/target/debug/xiom-pkg" >> "$GITHUB_OUTPUT"

      - name: Run e2e gate
        if: steps.client.outputs.client != ''
        env:
          XIOM_PKG_CLIENT: ${{ steps.client.outputs.client }}
        run: npm run test:e2e
