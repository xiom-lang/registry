name: Registry CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests + docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/app.js
          node --check seed.js
          node --check scripts/keygen.js

      # Compose interpolation and schema errors fail here, not on the VPS.
      # Both profiles render with the defaults in docker-compose.yml (no .env).
      - name: Compose config validation
        run: |
          docker compose config -q
          docker compose --profile staging config -q

      - name: Unit tests
        run: npm test

      - name: Docker build
        run: docker build -t xiom-registry:ci .

      # Boot the image and hit real routes. The Dockerfile copies only the
      # root-level files the service reads at runtime; this smoke catches a
      # missing file (ENOENT at startup) that unit tests, run from the
      # checkout, can never see. (Ops caught exactly that on staging 2.1.)
      - name: Image smoke (boot the built image)
        run: |
          set -euo pipefail
          # TRUST_PROXY=1 mirrors production (one nginx hop) and must never
          # produce ERR_ERL_PERMISSIVE_TRUST_PROXY in the log.
          docker run -d --name registry-smoke -p 127.0.0.1:3210:3000 -e TRUST_PROXY=1 xiom-registry:ci
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3210/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^registry-smoke$'; then
              echo "::error::registry-smoke exited before becoming healthy"
              docker logs registry-smoke
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::registry-smoke did not become healthy in 30s"
            docker logs registry-smoke
            exit 1
          fi
          echo "health: $(curl -fsS http://127.0.0.1:3210/health)"
          for path in /publish /whats-new /packages /index.json; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "http://127.0.0.1:3210${path}")"
            echo "${path} -> ${status}"
            case "$status" in
              200|301) ;;
              *) echo "::error::${path} returned ${status} from the built image"; docker logs registry-smoke; exit 1 ;;
            esac
          done
          if ! curl -fsS -H 'Accept: text/html' http://127.0.0.1:3210/publish | grep -q 'Publishing to XIOM'; then
            echo "::error::/publish did not render the guide"
            docker logs registry-smoke
            exit 1
          fi
          if docker logs registry-smoke 2>&1 | grep -q 'ERR_ERL'; then
            echo "::error::rate-limiter validation error in the boot log (trust proxy setting?)"
            docker logs registry-smoke
            exit 1
          fi

      - name: Image smoke cleanup
        if: always()
        run: |
          docker logs registry-smoke 2>/dev/null | tail -n 20 || true
          docker rm -f registry-smoke 2>/dev/null || true
